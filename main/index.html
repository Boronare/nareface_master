<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'/>
<title>nareface Wi‑Fi Setup</title>
<style>body{font-family:sans-serif;margin:12px}button,input,select{font:16px sans-serif;padding:6px}.radio-group{margin:8px 0}.hidden{display:none}</style>
</head><body>
<h2>Setting</h2>
<div id="dProv">
<button onclick=location.reload(true)>AP Scan</button>
<form id=f onsubmit='return submitProv(event)'>
<div class=radio-group>
<label><input type=radio name=ssidMode value=select checked onchange='toggleSsidInput()'> Select from scan list</label><br>
<label><input type=radio name=ssidMode value=manual onchange='toggleSsidInput()'> Enter manually (for hidden SSID)</label>
</div>
<p id=selectGroup><label>SSID <select id=ssidSel></select></label></p>
<p id=manualGroup style='display:none'><label>SSID <input type=text id=ssidManual size=32 placeholder='Enter SSID'></label></p>
<p><label>Password <input type=password name=pass id=pass size=64></label></p>
<p><button type=submit>Connect</button></p>
<pre id="provLog"></pre>
</form>
</div>
<div id="dSettings" class="hidden">
<form id=mdnsForm onsubmit='return submitSettings(event)'>
<p><label>mDNS Service Name <input type=text name=mdns id=mdns size=32 placeholder='nareface'>.local</label></p>
<p><button type=submit>Update</button></p>
</form>
Battery State : <label id="soc"></label>
<hr><h3>Upload firmware</h3>
<h4>current version : v1.0.3 260708</h4>
<input type=file id=fw accept='.bin'/> 
<button onclick='upload()'>Upload</button>
<pre id=log></pre>
</div>
<script>
function toggleSsidInput(){const mode=document.querySelector('input[name=ssidMode]:checked').value;document.getElementById('selectGroup').style.display=mode==='select'?'block':'none';document.getElementById('manualGroup').style.display=mode==='manual'?'block':'none';}
async function scan(){const j=window.__APS||[];const s=document.getElementById('ssidSel');s.innerHTML='';j.forEach(ap=>{const o=document.createElement('option');o.text=ap.ssid+' ('+ap.rssi+')';o.value=ap.ssid;s.add(o)});document.getElementById('aps').innerText='AP Count: '+j.length;}
async function submitProv(e){e.preventDefault();const mode=document.querySelector('input[name=ssidMode]:checked').value;const ssid=mode==='select'?document.getElementById('ssidSel').value:document.getElementById('ssidManual').value;if(!ssid){alert('Enter SSID');return;}const pass=document.getElementById('pass').value;const body=new URLSearchParams({ssid:ssid,pass:pass}).toString();const log=document.getElementById('provLog');log.textContent='Connecting...';const r=await fetch('/provision',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok){alert('연결 실패');log.textContent='자격증명 전송 실패.';return;}let ok=false;for(let i=0;i<15;i++){await new Promise(res=>setTimeout(res,1000));try{const s=await fetch('/ip');if(s.ok){const j=await s.json();if(j.connected){ok=true;alert('Connected! IP: '+j.ip);log.textContent='Connected: '+j.ip;break;}}}catch(_){}log.textContent='Connecting... ('+(i+1)+'s)';}if(!ok){alert('Connection failed');log.textContent='Connection failed.';}}
async function submitSettings(e){e.preventDefault();const mdns=document.getElementById('mdns').value;const body=new URLSearchParams({mdns:mdns}).toString();const r=await fetch('/provision',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});alert(r.ok?'Saved. Trying connect…':'Failed');}
async function upload(){const f=document.getElementById('fw').files[0];if(!f){alert('Select File');return;}const log=document.getElementById('log');log.textContent='Uploading...';try{const r=await fetch('/ota',{method:'POST',body:f});const t=await r.text();log.textContent=t;}catch(e){log.textContent='Failed: '+e;}}
if(!window.__APS){document.getElementById('dProv').classList.add('hidden');document.getElementById('dSettings').classList.remove('hidden');}
else scan();
(()=>{document.getElementById('soc').innerText=window.__SOC+'%';})();
</script>
</body></html>
